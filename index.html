<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Tabula Rasa Works</title>
  <meta name="description" content="Physical releases, design, production, and distribution for artists. Vinyl, cassette, CD, DVD, Bandcamp, and catalog work." />

  <style>
    :root {
      --cream: #f3efe4;
      --ink: #1a1a1a;
      --olive: #4f5630;
      --gold: #b49a63;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
    }

    .placeholder {
      width: min(100%, 1100px);
      height: auto;
      display: block;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.14);
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: var(--cream);
    }

    .contact {
      margin-top: 28px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 13px;
    }
.button {
  display: inline-block;
  padding: 14px 22px;
  border: 1px solid var(--gold);
  background: var(--olive);
  color: var(--cream) !important;
  text-decoration: none;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: 12px;
}

.button:hover {
  background: var(--ink);
  color: var(--cream) !important;
}

.small-contact {
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
    .contact a {
      color: var(--olive);
      text-decoration: none;
      border-bottom: 1px solid var(--gold);
      padding-bottom: 3px;
    }

    .contact a:hover {
      color: var(--ink);
    }

    footer {
      margin-top: 22px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(26, 26, 26, 0.6);
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="placeholder"
      src="trw-placeholder.png"
      alt="Tabula Rasa Works overview: physical releases, design, production, and distribution for artists."
    />

    <div class="contact">
  <a
    class="button"
    href="mailto:tabularasaworks@proton.me?subject=Start%20a%20Release%20Inquiry&body=Artist%20%2F%20Project%20Name%3A%0D%0A%0D%0ARelease%20Title%3A%0D%0A%0D%0AWhat%20kind%20of%20project%20is%20this%3F%20%28Album%2C%20EP%2C%20Single%2C%20Live%20Session%2C%20Catalog%20%2F%20Archive%2C%20Other%29%3A%0D%0A%0D%0AFormats%20you%27re%20considering%20%28Vinyl%2C%20Cassette%2C%20CD%2C%20DVD%2C%20Bandcamp%2C%20Catalog%20Work%2C%20Not%20Sure%29%3A%0D%0A%0D%0AProduction%20path%20%28Made-to-order%2C%20Bulk%2C%20Hybrid%2C%20Not%20Sure%29%3A%0D%0A%0D%0AAre%20final%20audio%20masters%20ready%3F%3A%0D%0A%0D%0AIs%20artwork%20ready%3F%3A%0D%0A%0D%0AApproximate%20runtime%3A%0D%0A%0D%0ANumber%20of%20tracks%3A%0D%0A%0D%0ATarget%20timeline%3A%0D%0A%0D%0AEstimated%20quantity%20or%20release%20goal%3A%0D%0A%0D%0AWhat%20support%20do%20you%20need%3F%20%28Format%20planning%2C%20sequencing%2C%20packaging%2C%20mockups%2C%20Bandcamp%20setup%2C%20vendor%20coordination%2C%20release%20copy%2C%20catalog%20organization%29%3A%0D%0A%0D%0ATell%20us%20about%20the%20release%3A%0D%0A"
  >
    Start a Release
  </a>

  <p class="small-contact">
    or email <a href="mailto:tabularasaworks@proton.me">tabularasaworks@proton.me</a>
  </p>
</div>

    <footer>
      Built in Brooklyn · A blank slate. Something made real.
    </footer>
  </main>
</body>
</html>
